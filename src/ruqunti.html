<!DOCTYPE html>

    <link rel="stylesheet" href="./static/css/index.css">
    <link rel="icon" href="./static/images/favicon.ico">
    <!-- 词典先就位：兜底标题按语言定，关卡数据回来后 level-loader 再换成具体关卡 -->
    <script>
        // 跨文档过渡：先挂好就绪 promise（level-loader 画完关卡后 resolve），
        // 这样 pagereveal 会等图形画完再切入
        window.__pageReady = new Promise(resolve => { window.__resolvePageReady = resolve; });
        // 入群题答题页：屏蔽「查看答案 / 设计模式 / 打开求解器」三项菜单，返回键回到题目列表
        window.quizMode = true;
    </script>
    <script src="./static/js/i18n.js"></script>
    <script>
        document.title = '入群题 | Geommunity Blueprint';
    </script>
    <style>
      .quiz-select { position: fixed; inset: 0; z-index: 1000; background: var(--paper, #f4f0e8); overflow-y: auto; padding: 32px 16px 56px; }
      .quiz-select-inner { max-width: 1000px; margin: 0 auto; }
      .quiz-title { font-size: 30px; margin: 6px 0 4px; }
      .quiz-sub { color: var(--muted, #6b7280); margin: 0 0 24px; }
      .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
      .quiz-card { display: block; background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s ease, box-shadow .15s ease; }
      .quiz-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.12); }
      .quiz-card img { width: 100%; object-fit: cover; background: #eef0f2; display: block; }
      .quiz-card-body { padding: 10px 12px 12px; }
      .quiz-card-title { font-weight: 700; font-size: 16px; }
      .quiz-card-meta { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
      .quiz-tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--blue, #3b82f6); color: #fff; }
      .quiz-steps { font-size: 12px; color: var(--muted, #6b7280); }
    </style>
</head>

    <!-- 入群题：关卡信息内联；gmt 与题图放在 ../data/ruqunti/，选关页渲染 + 关卡加载都在此完成 -->
    <script>
    (function () {
      // tools 字段：'grid'=网格，'straightedge'=单尺，'compass'=单规，''=尺规（不限）
      const QUIZ_LEVELS = [
        {
          id: 'q1', title: 'Q1', file: 'Q1.gmt', tools: 'grid', targetSteps: '3E', image: 'Q1.jpg',
          problem: '如图，在每个边长为1的正方形网格中，点A，B均落在格点上，点C在线段AB上，点D在网格线上，给出△BCD的外接圆，请用无刻度的直尺，在线段AB上找到一个点P，使CP=DP。',
        },
        {
          id: 'q2', title: 'Q2', file: 'Q2.gmt', tools: '', targetSteps: '8E', image: 'Q2.jpg',
          problem: '∠AOB内有一点C，作正三角形CDE，使得D在OA上，E在OB上。',
        },
        {
          id: 'q3', title: 'Q3', file: 'Q3.gmt', tools: '', targetSteps: '4E', image: 'Q3.jpg',
          problem: '过点B作弦DE，使得该点截弦比例为1:2。',
        },
        {
          id: 'q4', title: 'Q4', file: 'Q4.gmt', tools: 'straightedge', targetSteps: '7E', image: 'Q4.jpg',
          problem: '已知圆O及互垂直径AB、CD，E为线段AO上一点（不与A、O重合）。仅用无刻度的直尺，求作一弦CP，使CP=CE，且∠AOP为锐角。',
        },
        {
          id: 'q5', title: 'Q5', file: 'Q5.gmt', tools: 'grid', targetSteps: '3E', image: 'Q5.jpg',
          problem: '如图，在每个边长为1的正方形网格中，半圆经过格点A、B，BC是半圆的直径，请用无刻度的直尺，在半圆上确定一点P，使线段PB:PC=6:7。',
        },
        {
          id: 'q6', title: 'Q6', file: 'Q6.gmt', tools: 'OC', targetSteps: '6L', image: 'Q6.jpg',
          problem: '仅使用圆工具（圆规亦可），求作一点，使其"黄金分割"给定线段。',
        }
      ];

      const params = new URLSearchParams(location.search);
      const q = params.get('q');
      const selectEl = document.getElementById('quiz-select');
      const toolLabel = t => ({ grid: '网格', straightedge: '单尺', compass: '单规', '': '尺规' })[t] || '特殊';

      // 选关页：无 ?q= 时渲染卡片；带 ?q= 时隐藏覆盖层、进入游玩页
      if (!q) {
        if (selectEl) {
          const grid = selectEl.querySelector('.quiz-grid');
          QUIZ_LEVELS.forEach(level => {
            const a = document.createElement('a');
            a.className = 'quiz-card';
            a.href = './ruqunti.html?mode=level&q=' + encodeURIComponent(level.id);
            const img = document.createElement('img');
            img.src = '../data/ruqunti/' + level.image;
            img.alt = level.id;
            img.loading = 'lazy';
            const body = document.createElement('div');
            body.className = 'quiz-card-body';
            body.innerHTML = '<div class="quiz-card-title">' + level.title + '</div>' +
              '<div class="quiz-card-meta"><span class="quiz-tag">' + toolLabel(level.tools) + '</span>' +
              '<span class="quiz-steps">' + level.targetSteps + '</span></div>';
            a.appendChild(img);
            a.appendChild(body);
            grid.appendChild(a);
          });
        }
      } else if (selectEl) {
        selectEl.style.display = 'none';
      }

      // 关卡加载器：从 ../data/ruqunti/<file>.gmt 读取（与题图同目录，单一来源）
      if (q) {
        const level = QUIZ_LEVELS.find(l => l.id === q);
        if (!level) {
          if (window.__resolvePageReady) window.__resolvePageReady();
        } else {
          window.levelTools = level.tools || null;
          // 游玩页页签显示具体题名（选关页仍由文末脚本固定为「入群题」），不被 board-tools 覆盖
          document.title = level.title + ' | Geommunity Blueprint'; window.__boardPageTitle = document.title;
          if (typeof refreshToolLimit === 'function') refreshToolLimit();
          fetch('../data/ruqunti/' + level.file)
            .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
            .then(text => {
              const { elements, lists, resultGroups, grid } = parseGmt(text);
              window.gmtResultGroups = resultGroups || [];
              sessionStorage.setItem('elements', JSON.stringify(elements));
              sessionStorage.setItem('geometryElementLists', JSON.stringify(lists));
              sessionStorage.setItem('thumbnail', JSON.stringify({
                title_input: level.title,
                body_input: level.problem,
                bottom_input: level.targetSteps || '',
                pictureData: level.image ? '../data/ruqunti/' + level.image : null
              }));
              if (typeof geometryManagerResult !== 'undefined') {
                Object.entries(lists).forEach(([key, value]) => { geometryElementLists[key] = new Set(value); });
                const titleInf = document.getElementById('title_inf'); if (titleInf) titleInf.textContent = level.title;
                const bodyInf = document.getElementById('body_inf'); if (bodyInf) bodyInf.textContent = level.problem;
                const bottomInf = document.getElementById('bottom_inf');
                if (bottomInf && level.targetSteps) { bottomInf.dataset.goalSteps = '1'; bottomInf.textContent = level.targetSteps; }
                loadGeometryElementsStorage();
                if (grid && typeof window.boardGmt === 'object' && typeof window.boardGmt.setGridFromGmt === 'function') window.boardGmt.setGridFromGmt(grid);
                if (typeof fitInitialView === 'function') fitInitialView();
                drawContent();
                const picture = document.getElementById('thumbnail-picture');
                if (level.image && !picture) {
                  const pic = document.createElement('img');
                  pic.id = 'thumbnail-picture';
                  pic.src = '../data/ruqunti/' + level.image;
                  pic.alt = level.id;
                  const mid = document.getElementById('thumbnail-middle');
                  if (mid) mid.appendChild(pic);
                }
                const restoredPlay = typeof playBackupRestored !== 'undefined' && playBackupRestored;
                const restoredHistory = restoredPlay && typeof playBackupHistoryRestored !== 'undefined' && playBackupHistoryRestored;
                if (!restoredHistory && typeof resetStorageHistory === 'function') resetStorageHistory(restoredPlay);
                if (!restoredPlay) {
                  if (typeof resetLevelProgress === 'function') resetLevelProgress();
                  if (typeof resetThumbnailTicks === 'function') resetThumbnailTicks();
                }
                if (typeof refreshLevelStatus === 'function') refreshLevelStatus();
                if (typeof refreshToolLimit === 'function') refreshToolLimit();
              }
            })
            .catch(err => { console.error('[ruqunti] 加载 gmt 失败', err); })
            .then(() => { if (window.__resolvePageReady) window.__resolvePageReady(); });
        }
      } else if (window.__resolvePageReady) {
        window.__resolvePageReady();
      }
    })();
    </script>
