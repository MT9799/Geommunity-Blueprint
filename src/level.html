<!DOCTYPE html>

    <link rel="stylesheet" href="./static/css/index.css">
    <link rel="icon" href="./static/images/favicon.ico">
    <!-- 词典先就位：兜底标题按语言定，关卡数据回来后 level-loader 再换成具体关卡 -->
    <script src="./static/js/i18n.js"></script>
    <script>
        (function () {
            const testPlay = new URLSearchParams(location.search).get('mode') === 'maker-play';
            document.title = `${t(testPlay ? 'level.testPlayTitle' : 'level.pageTitle')} | Geommunity Blueprint`;
        })();
    </script>
</head>
<body>
    <!-- 缩略图 -->
    <div id="thumbnail" class="thumbnail" style="display: none;">
        <div class="hidden_inf thumbnail-title" style="display: none;">
            <div class="thumbnail-title-container">
                <button id="thumbnail-title-switch-hidden">
<svg class="button-icon-toolbar svg-icon" viewBox="0 0 200 200">
<polygon points="
60 100, 
120 40, 
160 80, 
100 140, 
60 140" 
fill="transparent" stroke-width="10"  stroke-linejoin="round"/>
<line x1="60" y1="100" x2="100" y2="140" fill="transparent" stroke-width="10" stroke-linecap="round"/>
<line x1="100" y1="60" x2="140" y2="100" fill="transparent" stroke-width="10" stroke-linecap="round"/>
<line x1="40" y1="160" x2="160" y2="160" fill="transparent" stroke-width="10" stroke-linecap="round"/>
</svg>
                </button>
                <div class="switch_inf" id="title_inf">&emsp;</div>
                <button id="thumbnail-title-button">
<svg class="svg-icon" viewBox="0 0 200 200">
<line x1="50" y1="50" x2="150" y2="150" stroke-width="10" fill="transparent" stroke-linecap="round"/>
<line x1="150" y1="50" x2="50" y2="150" stroke-width="10" fill="transparent" stroke-linecap="round"/>
</svg>
                </button>
            </div>
            <div class="full-width"><hr></div>
        </div>
        <div class="thumbnail-middle" id="thumbnail-middle">
            <!-- 收起时的小窗：目标步数（未达成黑色、达成金色），浮在图片左上角 -->
            <div class="level-goal-badge" id="level-goal-badge" hidden></div>
        </div>
        <div class="hidden_inf thumbnail-body" style="display: none;">
            <div class="thumbnail-bottom-container">
                <div data-i18n="level.goal">目标：</div>
                <div class="switch_inf" id="bottom_inf">&emsp;</div>
                <!-- 达成情况：完成 / L / E / V 四个勾，紧跟在目标步数后面 -->
                <div id="level-status" class="level-status">
                    <span class="level-tick" data-tick="done"><span class="complete-check">&#10004;</span><span data-i18n="level.tickDone">完成</span></span>
                    <span class="level-tick" data-tick="l"><span class="complete-check">&#10004;</span>L</span>
                    <span class="level-tick" data-tick="e"><span class="complete-check">&#10004;</span>E</span>
                    <span class="level-tick" data-tick="v"><span class="complete-check">&#10004;</span>V</span>
                </div>
            </div>
            <div class="full-width"><hr></div>
            <div class="thumbnail-body-container">
                <div class="switch_inf" id="body_inf">&emsp;</div>
            </div>
        </div>
    </div>
    <div id="masks" class="masks"></div>
    <!-- 步数显示 -->
    <div class="moves-layout">
        <p id="moves"></p>
    </div>
    <!-- 完成显示 -->
    <div class="complete-layout" id="complete-layout">
        <div class="complete-title" data-i18n="level.complete">
            任务完成
        </div>
        <div class="complete-body">
            <span class="complete-item" data-complete="done">
                <span class="complete-check">&#10004;</span>
                <span class="complete-name">完成</span>
            </span>
            <span class="complete-item" data-complete="l">
                <span class="complete-check">&#10004;</span>
                <span class="complete-name">L</span>
            </span>
            <span class="complete-item" data-complete="e">
                <span class="complete-check">&#10004;</span>
                <span class="complete-name">E</span>
            </span>
            <span class="complete-item" data-complete="v">
                <span class="complete-check">&#10004;</span>
                <span class="complete-name">V</span>
            </span>
        </div>
        <!-- 步数与目标对比：作出所求时显示是否达到 L / E 数 -->
        <p class="complete-steps" id="complete-steps"></p>
    </div>
